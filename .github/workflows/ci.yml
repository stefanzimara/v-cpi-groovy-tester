name: Build and smoke test

# Runs on every push and pull request. The point is that nobody has to
# remember to run the examples by hand - that is exactly how a bug that
# broke every Script Version 2.x script stayed unnoticed.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux, both Groovy profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # smoke.sh --profiles builds Groovy 4 and Groovy 3 itself and runs
      # every bundled example against every fixture in both.
      - name: Build and check all examples
        run: ./smoke.sh --profiles

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # The Windows scripts are a separate code path, not a translation of
      # the shell ones - so they get exercised rather than assumed to work.
      - name: Build
        shell: cmd
        run: build.bat

      - name: Check all examples
        shell: cmd
        run: smoke.bat
